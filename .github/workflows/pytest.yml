name: Windows package

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  smoke:
    name: Windows installed-package smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --no-deps

      - name: Doctor and deterministic turn
        run: |
          atm10 doctor
          atm10 run `
            --prompt "Describe ATM10 context." `
            --query "steel tools" `
            --action-intent open_quest_book `
            --runs-dir runs/ci-package-core `
            --state-dir .atm10-ci-state

      - name: Replay prior turn
        shell: pwsh
        run: |
          $turn = Get-ChildItem -Path "runs/ci-package-core" -Recurse -Filter "turn.json" |
            Select-Object -First 1
          if ($null -eq $turn) {
            throw "turn.json was not produced"
          }
          atm10 replay $turn.FullName `
            --runs-dir runs/ci-package-core `
            --state-dir .atm10-ci-state

      - name: Run companion-core eval
        run: |
          atm10 eval `
            --suite companion-core `
            --runs-dir runs/ci-package-eval `
            --state-dir .atm10-ci-state/eval `
            --reports-dir eval-results/ci-package-core
