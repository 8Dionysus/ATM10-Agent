name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-validation:
    name: Repo Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install Linux development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux-dev.txt
          python -m pip install -e . --no-deps

      - name: Validate standalone autonomy contracts
        run: |
          python -m scripts.validate_local_evals
          python -m scripts.generate_decision_indexes --check
          python -m scripts.validate_decision_records
          python -m pytest -q tests/test_autonomy_contract.py

      - name: Smoke - Autonomous companion package
        run: |
          atm10 doctor
          atm10 run \
            --prompt "Describe ATM10 context." \
            --query "steel tools" \
            --action-intent open_quest_book \
            --runs-dir runs/ci-package-core \
            --state-dir .atm10-ci-state
          TURN_JSON="$(find runs/ci-package-core -name turn.json -type f -print -quit)"
          test -n "$TURN_JSON"
          atm10 replay "$TURN_JSON" \
            --runs-dir runs/ci-package-core \
            --state-dir .atm10-ci-state
          atm10 eval \
            --suite companion-core \
            --runs-dir runs/ci-package-eval \
            --state-dir .atm10-ci-state/eval \
            --reports-dir eval-results/ci-package-core

      - name: Run package boundary tests
        run: |
          python -m pytest -q \
            tests/test_atm10_session_probe_adapters.py \
            tests/test_discover_instance.py \
            tests/test_package_boundary.py \
            tests/test_windows_capture.py \
            tests/test_windows_product_edge_contract.py \
            tests/test_portable_core_linux_workflow.py
