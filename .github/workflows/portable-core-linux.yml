name: Portable Core Linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: portable-core-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable_core_linux:
    name: Portable installed-package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --no-deps

      - name: Verify portable core
        run: |
          atm10 doctor
          atm10 run \
            --prompt "Describe ATM10 context." \
            --query "steel tools" \
            --action-intent open_quest_book \
            --runs-dir runs/ci-portable-core \
            --state-dir .atm10-ci-state
          atm10 eval \
            --suite companion-core \
            --runs-dir runs/ci-portable-eval \
            --state-dir .atm10-ci-state/eval \
            --reports-dir eval-results/ci-portable-core
